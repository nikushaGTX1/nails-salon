<section id="gift" class="section gift">
  <div class="gift-copy" [appEditableBlock]="'giftCopy'">
    <p class="eyebrow" [appEditable]="'giftCert'">{{ i18n.t('giftCert') }}</p>
    <h2 [appEditable]="'giftCertTitle'">{{ i18n.t('giftCertTitle') }}</h2>
    <p class="gift-text" [appEditable]="'giftCertText'">{{ i18n.t('giftCertText') }}</p>
    @if (!showPhone) {
      <button type="button" class="gift-cta" (click)="reveal()">
        <span [appEditable]="'giftCertCta'">{{ i18n.t('giftCertCta') }}</span> →
      </button>
    } @else {
      <button type="button" class="gift-cta gift-cta--phone" (click)="copyPhone()">
        <span>{{ phoneDisplay }}</span>
        <span class="gift-cta-copy">{{ copied ? '✓' : '⧉' }}</span>
      </button>
    }
  </div>
  <div class="gift-visual" aria-hidden="true">
    <div
      class="gift-photo"
      [appEditableImage]="'giftCertImage'"
      [style.backgroundImage]="'url(' + site.media('giftCertImage', '/assets/hero.png') + ')'"
    ></div>
    <div class="gift-card">
      <div class="gift-card-top">
        <span class="gift-card-brand">NAIL BAR <em>01</em></span>
        <span class="gift-card-number">№ 001</span>
      </div>
      <span class="gift-card-label" [appEditable]="'giftCertVisualLabel'">{{
        i18n.t('giftCertVisualLabel')
      }}</span>
      <div class="gift-card-bottom">
        <span class="gift-card-rule"></span>
        <span class="gift-card-foot">Tbilisi · Georgia</span>
      </div>
    </div>
  </div>
</section>
