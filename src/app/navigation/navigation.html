<header
  class="topbar"
  [class.scrolled]="scrolled || isInnerPage"
  [class.menu-open]="menuOpen"
>
  <a class="brand" href="/#home" (click)="navigateToSection('home', $event)">
    <img src="/nailbar-transparent.png" alt="" />
    <span class="sr-only">NAIL BAR 01</span>
  </a>
  <button
    class="menu"
    type="button"
    (click)="menuOpen = !menuOpen"
    [attr.aria-expanded]="menuOpen"
    aria-controls="primary-navigation"
    [attr.aria-label]="menuOpen ? 'Close navigation' : 'Open navigation'"
  >
    <span></span><span></span>
  </button>
  <nav id="primary-navigation" [class.open]="menuOpen">
    <a href="/#services" (click)="navigateToSection('services', $event)"><span>01</span>Services</a>
    <a href="/#gallery" (click)="navigateToSection('gallery', $event)"><span>02</span>Portfolio</a>
    <a href="/#about" (click)="navigateToSection('about', $event)"><span>03</span>About</a>
    <a href="/#contact" (click)="navigateToSection('contact', $event)"><span>04</span>Locations</a>
  </nav>
  <a class="book-link" href="/#booking" (click)="navigateToSection('booking', $event)"
    >Book a visit ↗</a
  >
</header>
