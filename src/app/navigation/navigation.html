<header class="topbar" [class.scrolled]="scrolled || isInnerPage" [class.menu-open]="menuOpen">
  <a class="brand" href="/#home" (click)="navigateToSection('home', $event)"
    ><img [src]="site.media('logo', '/nailbar-transparent.png')" alt="" /><span class="sr-only"
      >NAIL BAR 01</span
    ></a
  >
  <button
    class="menu"
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    aria-controls="primary-navigation"
    [attr.aria-label]="i18n.t(menuOpen ? 'closeNav' : 'openNav')"
  >
    <span></span><span></span>
  </button>
  <nav id="primary-navigation" [class.open]="menuOpen">
    <a href="/#services" (click)="navigateToSection('services', $event)"
      ><span>01</span><span [appEditable]="'services'">{{ i18n.t('services') }}</span></a
    >
    <a href="/#gallery" (click)="navigateToSection('gallery', $event)"
      ><span>02</span><span [appEditable]="'portfolio'">{{ i18n.t('portfolio') }}</span></a
    >
    <a href="/#about" (click)="navigateToSection('about', $event)"
      ><span>03</span><span [appEditable]="'reviews'">{{ i18n.t('reviews') }}</span></a
    >
    <a href="/#contact" (click)="navigateToSection('contact', $event)"
      ><span>04</span><span [appEditable]="'locations'">{{ i18n.t('locations') }}</span></a
    >
    <a href="/#loyalty" (click)="navigateToSection('loyalty', $event)"
      ><span>05</span><span [appEditable]="'loyalty'">{{ i18n.t('loyalty') }}</span></a
    >
    <a
      class="mobile-booking"
      href="https://taplink.cc/nail_bar_1"
      target="_blank"
      rel="noopener"
      (click)="closeMenu()"
      ><span>06</span><span [appEditable]="'book'">{{ i18n.t('book') }}</span> ↗</a
    >
  </nav>
  <div class="topbar-actions">
    <div class="language-switcher" aria-label="Language">
      @for (language of languages; track language) {
        <button
          type="button"
          [class.active]="i18n.language() === language"
          (click)="i18n.setLanguage(language)"
        >
          {{ language === 'ka' ? 'GE' : language.toUpperCase() }}
        </button>
      }
    </div>
    <a class="book-link" href="https://taplink.cc/nail_bar_1" target="_blank" rel="noopener"
      ><span [appEditable]="'book'">{{ i18n.t('book') }}</span> ↗</a
    >
  </div>
</header>
