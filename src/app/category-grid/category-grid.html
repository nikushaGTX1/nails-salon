@if (site.categories().length) {
  <section id="categories" class="section category-grid-section">
    <div class="category-tiles">
      @for (category of site.categories(); track category.id) {
        <a
          class="category-tile"
          [routerLink]="editMode.isEditing() ? null : ['/category', category.id]"
          [appEditableBlock]="'category:' + category.id"
        >
          <img
            [src]="site.asset(category.imageUrl, '/assets/portfolio.png')"
            alt=""
            [appEditableItemImage]="imageSetter(category)"
          />
          <span class="category-tile-shade"></span>
          <span
            class="category-tile-label"
            [appEditableField]="fieldSetter(category.name, i18n.language())"
            [editStyleKey]="'category:' + category.id + ':name'"
            >{{ site.localized(category.name, i18n.language(), category.id) }}
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
              <path
                d="M2 1.5L6.5 5L2 8.5"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              /></svg
          ></span>
        </a>
      }
    </div>
  </section>
}
