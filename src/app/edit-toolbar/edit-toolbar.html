@if (editMode.isEditing()) {
  <div class="edit-toolbar">
    <span class="edit-toolbar-label"
      >Editing live site — click text to edit, drag/scroll a photo to reframe/zoom</span
    >
    @if (status) {
      <span class="edit-toolbar-status">{{ status }}</span>
    }
    <button type="button" (click)="save()" [disabled]="saving">
      {{ saving ? 'Saving…' : 'Save changes' }}
    </button>
    <button type="button" class="edit-toolbar-exit" (click)="exit()">Exit</button>
  </div>
}
