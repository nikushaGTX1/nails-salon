<section id="booking" class="section booking">
  <div>
    <p class="eyebrow">{{ i18n.t('booking') }}</p>
    <h2>{{ i18n.t('bookingTitle') }}</h2>
    <p>{{ i18n.t('bookingText') }}</p>
    <ul>
      <li>{{ i18n.t('manicure') }}</li>
      <li>{{ i18n.t('pedicure') }}</li>
      <li>{{ i18n.t('design') }}</li>
      <li>{{ i18n.t('extras') }}</li>
    </ul>
  </div>
  <form (submit)="submit($event)">
    <label
      >{{ i18n.t('name') }}<input
        name="bookingName"
        [(ngModel)]="form.name"
        required
        [placeholder]="i18n.t('yourName')"
    /></label>
    <label
      >{{ i18n.t('phone') }}<input
        name="bookingPhone"
        [(ngModel)]="form.phone"
        required
        type="tel"
        placeholder="+995 555 00 00 00"
    /></label>
    <label
      >{{ i18n.t('studioField') }}
      <select name="bookingStudio" [(ngModel)]="form.studio" required>
        <option value="" disabled>{{ i18n.t('chooseLocation') }}</option>
        @for (location of site.locations(); track location.id) {
          <option [value]="location.area">
            {{ location.area }} — {{ site.localized(location.address, i18n.language()) }}
          </option>
        }
      </select></label
    >
    <label
      >{{ i18n.t('service') }}
      <select name="bookingService" [(ngModel)]="form.service" required>
        <option value="" disabled>{{ i18n.t('chooseService') }}</option>
        @for (service of site.services(); track service.id) {
          <option [value]="site.localized(service.name, i18n.language())">
            {{ site.localized(service.name, i18n.language()) }}
          </option>
        }
      </select></label
    >
    <div class="form-row">
      <label
        >{{ i18n.t('date') }}<input
          name="bookingDate"
          [(ngModel)]="form.date"
          [min]="minDate"
          required
          type="date"
      /></label>
      <label
        >{{ i18n.t('time') }}
        <select name="bookingTime" [(ngModel)]="form.time">
          <option>10:00</option>
          <option>12:00</option>
          <option>14:00</option>
          <option>16:00</option>
        </select></label
      >
    </div>
    @if (bookingError) {
      <p class="error-message">{{ bookingError }}</p>
    }
    <button [disabled]="bookingSending">
      {{ bookingSending ? 'Sending…' : i18n.t(bookingSent ? 'sent' : 'book') }} <span>→</span>
    </button>
  </form>
</section>
