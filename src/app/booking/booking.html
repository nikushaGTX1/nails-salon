<section id="booking" class="section booking">
  <div>
    <p class="eyebrow" [appEditable]="'booking'">{{ i18n.t('booking') }}</p>
    <h2 [appEditable]="'bookingTitle'">{{ i18n.t('bookingTitle') }}</h2>
    <p [appEditable]="'bookingText'">{{ i18n.t('bookingText') }}</p>
    <ul>
      <li [appEditable]="'manicure'">{{ i18n.t('manicure') }}</li>
      <li [appEditable]="'pedicure'">{{ i18n.t('pedicure') }}</li>
      <li [appEditable]="'design'">{{ i18n.t('design') }}</li>
      <li [appEditable]="'extras'">{{ i18n.t('extras') }}</li>
    </ul>
  </div>
  <div class="booking-external">
    <p [appEditable]="'bookingText'">{{ i18n.t('bookingText') }}</p>
    <a href="https://n625749.alteg.io" target="_blank" rel="noopener">
      <span [appEditable]="'book'">{{ i18n.t('book') }}</span> <span>→</span>
    </a>
  </div>
</section>
