<section id="gallery" class="section gallery">
  <div class="gallery-head">
    <div>
      <p class="eyebrow">{{ i18n.t('selectedWork') }}</p>
      <h2>{{ i18n.t('ourPortfolio') }}</h2>
    </div>
    <div class="filters" [attr.aria-label]="i18n.t('filterPortfolio')">
      @for (filter of filters; track filter) {
        <button [class.active]="activeFilter === filter" (click)="activeFilter = filter">
          {{ i18n.t(filter) }}
        </button>
      }
    </div>
  </div>
  <div class="grid">
    @for (work of filteredWorks; track work.id; let i = $index) {
      <figure class="portfolio-card" [appEditableBlock]="'gallery:' + work.id">
        <div
          class="crop"
          [style.background-position]="work.position"
          [style.background-image]="
            'url(' +
            site.asset(work.imageUrl, site.media('galleryImage', '/assets/portfolio.png')) +
            ')'
          "
        >
          <a
            class="portfolio-link"
            [routerLink]="editMode.isEditing() ? null : '/portfolio'"
            [attr.aria-label]="
              i18n.t('viewPortfolio') +
              ': ' +
              site.localized(work.title, i18n.language(), i18n.t('w' + (i + 1)))
            "
            ><span class="view-portfolio">{{ i18n.t('viewPortfolio') }} ↗</span></a
          >
          @if (editMode.isEditing()) {
            <button
              type="button"
              class="replace-photo-btn"
              [appEditableItemImage]="imageSetter(work)"
            >
              Replace photo
            </button>
          }
        </div>
        <figcaption>
          <span
            [appEditableField]="fieldSetter(work.title, i18n.language())"
            [editStyleKey]="'gallery:' + work.id + ':title'"
            >{{ site.localized(work.title, i18n.language(), i18n.t('w' + (i + 1))) }}</span
          >
          <small>{{ (i + 1).toString().padStart(2, '0') }}</small>
        </figcaption>
      </figure>
    }
  </div>
</section>
